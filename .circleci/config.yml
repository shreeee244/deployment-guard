version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: pip install -r app/requirements.txt

      - run:
          name: Test application
          command: |
            python -c "from app.app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; print('Health check passed')"

  docker-build:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Login to Docker Hub
          command: |
            echo "" | docker login -u "" --password-stdin

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t "/deployment-guard:latest" \
              -t "/deployment-guard:" \
              .

      - run:
          name: Push Docker image
          command: |
            docker push "/deployment-guard:latest"
            docker push "/deployment-guard:"

workflows:
  deployment-pipeline:
    jobs:
      - test
      - docker-build:
          requires:
            - test
